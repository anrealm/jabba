name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: License copies match the root LICENSE
        working-directory: .
        run: cmp LICENSE python/LICENSE
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - name: Lint
        run: ruff check .
      - name: Test (5 consecutive runs to catch timing flakes)
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            python -m pytest -q
            echo "::endgroup::"
          done

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.75", stable]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}
      - name: No runtime dependencies
        run: |
          cargo tree -e normal --prefix none
          test "$(cargo tree -e normal --prefix none | wc -l)" -eq 1
      - name: Format and lint
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test (5 consecutive runs to catch timing flakes)
        run: for i in 1 2 3 4 5; do cargo test --quiet; done
