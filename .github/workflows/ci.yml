name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: License copies match the root LICENSE
        working-directory: .
        run: cmp LICENSE python/LICENSE
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - name: Lint
        run: ruff check .
      - name: Test (5 consecutive runs to catch timing flakes)
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            python -m pytest -q
            echo "::endgroup::"
          done
      - name: Build the native test libraries (protocol kit, C++ testkit)
        working-directory: cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j 4 --target jabba_ffi_testing_shared jabba_testkit
      - name: Foreign nodes — C and C++ nodes in Python graphs (5 runs)
        env:
          JABBA_FFI_TESTING_LIB: ${{ github.workspace }}/cpp/build/libjabba_ffi_testing.so
          JABBA_TESTKIT_LIB: ${{ github.workspace }}/cpp/build/libjabba_testkit.so
          JABBA_FOREIGN: testkit
        run: |
          for i in 1 2 3 4 5; do
            python -m pytest -q tests/test_ffi.py tests/test_conformance.py
          done

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.75", stable]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}
      - name: No runtime dependencies
        run: |
          cargo tree -e normal --prefix none --features ffi
          test "$(cargo tree -e normal --prefix none --features ffi | wc -l)" -eq 1
      - name: Format and lint
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features ffi -- -D warnings
          cd testkit && cargo fmt --check && cargo clippy -- -D warnings
      - name: Test (5 consecutive runs to catch timing flakes)
        run: for i in 1 2 3 4 5; do cargo test --quiet; done
      - name: Build the native test libraries (protocol kit, C++ testkit, Rust testkit)
        run: |
          cmake -S ../cpp -B ../cpp/build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build ../cpp/build -j 4 --target jabba_ffi_testing_shared jabba_testkit
          cargo build --manifest-path testkit/Cargo.toml
      - name: Foreign nodes — C, C++ and Rust nodes in Rust graphs (5 runs)
        env:
          JABBA_FFI_TESTING_LIB: ${{ github.workspace }}/cpp/build/libjabba_ffi_testing.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
          CPP_TESTKIT: ${{ github.workspace }}/cpp/build/libjabba_testkit.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
          RUST_TESTKIT: ${{ github.workspace }}/rust/testkit/target/debug/libjabba_testkit.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
        run: |
          for i in 1 2 3 4 5; do
            cargo test --quiet --features ffi
            JABBA_FOREIGN=testkit JABBA_TESTKIT_LIB="$CPP_TESTKIT" cargo test --quiet --features ffi --test conformance
            JABBA_FOREIGN=testkit JABBA_TESTKIT_LIB="$RUST_TESTKIT" cargo test --quiet --features ffi --test conformance
          done

  interop:
    # Rust nodes in graphs of the other languages: the Rust testkit under the Python and
    # C++ conformance drivers (shared and statically linked).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the Rust testkit
        working-directory: rust/testkit
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release
      - name: Rust nodes in Python graphs (5 runs)
        working-directory: python
        env:
          JABBA_FOREIGN: testkit
          JABBA_TESTKIT_LIB: ${{ github.workspace }}/rust/testkit/target/release/libjabba_testkit.so
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
          for i in 1 2 3 4 5; do python -m pytest -q tests/test_conformance.py; done
      - name: Rust nodes in C++ graphs (shared and static, 5 runs each)
        working-directory: cpp
        env:
          JABBA_FOREIGN: testkit
        run: |
          for kind in so a; do
            cmake -S . -B build-$kind -DCMAKE_BUILD_TYPE=Debug \
              -DJABBA_TESTKIT_LIBRARY=${{ github.workspace }}/rust/testkit/target/release/libjabba_testkit.$kind
            cmake --build build-$kind -j 4 --target jabba_conformance_ffi
            for i in 1 2 3 4 5; do ./build-$kind/jabba_conformance_ffi; done
          done

  cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++-13 }
          - { os: ubuntu-latest, cxx: g++-14 }
          - { os: ubuntu-24.04, cxx: clang++-16, apt: clang-16 }  # the oldest supported clang is not in newer images
          - { os: ubuntu-latest, cxx: clang++-18, apt: clang-18 }
          - { os: macos-latest, cxx: clang++ }
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v4
      - name: Copies match their originals (license, ABI header)
        working-directory: .
        run: |
          cmp LICENSE cpp/LICENSE
          cmp ffi/jabba_ffi.h cpp/include/jabba/jabba_ffi.h
      - name: Install the compiler
        if: matrix.apt
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.apt }}
      - name: "Configure (Debug, -O0: no reliance on optimizer tail calls)"
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 4
      - name: Test (5 consecutive runs to catch timing flakes)
        run: for i in 1 2 3 4 5; do ctest --test-dir build --output-on-failure; done

  cpp-sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j 4
      - name: Test (3 runs)
        run: for i in 1 2 3; do ctest --test-dir build --output-on-failure; done
