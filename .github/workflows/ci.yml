name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - name: Lint
        run: ruff check .
      - name: Test (5 consecutive runs to catch timing flakes)
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::run $i"
            python -m pytest -q
            echo "::endgroup::"
          done
