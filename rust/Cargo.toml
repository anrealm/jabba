[package]
name = "jabba"
version = "2.0.0-alpha.0"
edition = "2021"
rust-version = "1.75"
description = "Compiled graphs of async nodes: parallel execution, declared failure policy, one record per run"
license-file = "../LICENSE"
repository = "https://github.com/anrealm/jabba"
readme = "README.md"

[features]
# Foreign nodes over the C ABI (spec/ffi.md): use nodes of other languages, export Rust nodes.
ffi = []

[dependencies]

[[test]]
name = "ffi"
required-features = ["ffi"]

[dev-dependencies]
serde_json = "1"
