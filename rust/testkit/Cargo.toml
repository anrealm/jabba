[package]
name = "jabba-testkit"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
description = "The Rust testkit (ffi/testing/jabba_testkit.h): scripted conformance nodes exported over the ABI"
license-file = "../../LICENSE"
publish = false

[lib]
name = "jabba_testkit"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jabba = { path = "..", features = ["ffi"] }
